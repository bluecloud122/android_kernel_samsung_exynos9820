name: Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Device to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - d1
          - d1xks
          - d2s
          - d2x
          - d2xks

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - model: d1
            defconfig: exynos9820-d1_defconfig
          - model: d1xks
            defconfig: exynos9820-d1x_defconfig
          - model: d2s
            defconfig: exynos9820-d2s_defconfig
          - model: d2x
            defconfig: exynos9820-d2x_defconfig
          - model: d2xks
            defconfig: exynos9820-d2x_defconfig

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc bison flex libssl-dev libncurses-dev gcc-aarch64-linux-gnu

      - name: Skip unwanted model
        if: ${{ github.event.inputs.model != 'all' && github.event.inputs.model != matrix.model }}
        run: exit 0

      - name: Setup build output
        run: mkdir -p out

      - name: Build kernel config
        run: |
          make ARCH=arm64 O=out ${{ matrix.defconfig }}

      - name: Build kernel
        run: |
          make ARCH=arm64 O=out -j$(nproc)

      - name: Package kernel
        run: |
          mkdir -p release
          cp -r out/arch/arm64/boot/* release/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exynos9820-${{ matrix.model }}
          path: release
