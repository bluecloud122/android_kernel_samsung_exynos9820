name: Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Device to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - d1
          - d1xks
          - d2s
          - d2x
          - d2xks

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - model: d1
            defconfig: exynos9820-d1_defconfig
          - model: d1xks
            defconfig: exynos9820-d1x_defconfig
          - model: d2s
            defconfig: exynos9820-d2s_defconfig
          - model: d2x
            defconfig: exynos9820-d2x_defconfig
          - model: d2xks
            defconfig: exynos9820-d2x_defconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev zip curl git wget python3 clang lld llvm

      - name: Skip unwanted model
        if: ${{ github.event.inputs.model != 'all' && github.event.inputs.model != matrix.model }}
        run: exit 0

      - name: Set up environment
        run: |
          mkdir -p out
          export ARCH=arm64
          export SUBARCH=arm64

      - name: Set Clang toolchain
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Build defconfig
        run: |
          make ARCH=arm64 O=out ${{ matrix.defconfig }}

      - name: Build kernel with Clang
        run: |
          make ARCH=arm64 O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            -j$(nproc)

      - name: Package output
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image* release/ || true
          cp out/arch/arm64/boot/dtb* release/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exynos9820-${{ matrix.model }}
          path: release
