name: Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Device to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - d1
          - d1xks
          - d2s
          - d2x
          - d2xks

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        model: [d1, d1xks, d2s, d2x, d2xks]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc python3

      - name: Skip unwanted builds
        if: ${{ github.event.inputs.model != 'all' && github.event.inputs.model != matrix.model }}
        run: exit 0

      - name: Set build config
        id: cfg
        run: |
          case "${{ matrix.model }}" in
            d1) echo "config=build.config.universal9820" >> $GITHUB_OUTPUT ;;
            d1xks) echo "config=build.config.universal9825" >> $GITHUB_OUTPUT ;;
            d2s) echo "config=build.config.universal9820" >> $GITHUB_OUTPUT ;;
            d2x) echo "config=build.config.universal9820" >> $GITHUB_OUTPUT ;;
            d2xks) echo "config=build.config.universal9825" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build kernel
        run: |
          chmod +x build/build.sh
          BUILD_CONFIG=${{ steps.cfg.outputs.config }} build/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exynos9820-${{ matrix.model }}
          path: out/*
